[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "srm"
version = "1.0.0"
description = "Deep-Learning-Based Super-Resolution Mapping (SRM) from Medium-Resolution Satellite Imageries"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "torch",
    "opensr-model",
    "sen2sr",
    "cubo",
    "mlstac",
    "opensr-utils",
    "opensr-test",
    "rasterio",
    "rioxarray",
    "scikit-image",
    "lpips",
    "pyyaml",
    "streamlit>=1.30",
    "plotly>=5.0",
    "folium>=0.14",
    "streamlit-folium>=0.15",
    "omegaconf>=2.3",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["srm*"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
markers = [
    "integration: mark test as requiring external network or live data access",
]
