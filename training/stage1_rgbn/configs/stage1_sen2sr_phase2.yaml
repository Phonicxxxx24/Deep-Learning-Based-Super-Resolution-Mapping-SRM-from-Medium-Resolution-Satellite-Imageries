# Phase 2: High-Frequency Texture & Edge Refinement (Target: 2.1 Hours, bringing total to ~4.5 Hours)
model:
  type: Sen2SR_RGBN
  in_channels: 4
  out_channels: 4
  feat_ch: 64
  num_blocks: 8
  scale: 4

data:
  dataset: SEN2NAIPv2
  raw_dir: data/raw
  splits_dir: data/splits
  lmdb_dir: data/lmdb_cache
  scale: 4
  patch_size_lr: 96
  norm_factor: 10000.0

training:
  epochs: 45
  batches_per_epoch: 800
  batch_size: 4
  grad_accumulation: 2
  amp_fp16: true
  num_workers: 0
  pin_memory: true
  persistent_workers: true
  grad_clip: 1.0

  optimizer:
    type: AdamW
    lr: 0.00005          # 5e-5 fine-tuning rate
    betas: [0.9, 0.999]
    weight_decay: 0.0001
    eps: 1.0e-8

  scheduler:
    type: cosine_with_warmup
    warmup_epochs: 1
    min_lr: 1.0e-6

  checkpointing:
    save_dir: checkpoints_sen2sr_phase2
    save_every: 5
    auto_resume: true
    init_from: checkpoints_sen2sr/best_psnr.pth

  logging:
    log_every: 50
    tensorboard: true
    csv: true

loss:
  w_l1: 0.6
  w_sam: 0.25
  w_lap: 1.2             # 3x boost to Laplacian edges
  w_grad: 1.2            # 3x boost to gradient contours
  w_obs: 0.1

seed: 42
