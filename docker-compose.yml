services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: srm-backend
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      - PORT=8000
      - CORS_ORIGINS=http://localhost:3000,http://127.0.0.1:3000
      - CARTO_API_KEY=${CARTO_API_KEY:-}
    volumes:
      - srm_data:/app/data
      - srm_outputs:/app/outputs

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: srm-frontend
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      - NEXT_PUBLIC_API_URL=http://localhost:8000
    depends_on:
      - backend

volumes:
  srm_data:
    driver: local
  srm_outputs:
    driver: local
