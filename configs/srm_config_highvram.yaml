# SRM Pipeline Configuration — HIGH VRAM (48 GB+)
# Target hardware: University / HPC machine with A6000 / A100 / H100 / equivalent
# DO NOT use this on RTX 3050 6GB — will OOM.
#
# Usage:
#   python run_pipeline.py --aoi agri_valencia --config configs/srm_config_highvram.yaml
#   python run_pipeline.py --all-aois          --config configs/srm_config_highvram.yaml
#   python run_pipeline.py --benchmark         --config configs/srm_config_highvram.yaml

# ── Global execution ──────────────────────────────────────────────────────────
device: "cuda"
n_uncertainty: 25          # Full spec (was 5 on 6GB). 25 stochastic passes → true 95% CI
sampling_steps: 100        # Full DDIM quality (was 50 on 6GB). 2× sharper textures
eta: 0.95                  # Stochastic sampling — keeps realistic texture variation
patch_size: 128            # Hard limit from LDSR-S2 training — do not increase
overlap: 32                # Seamless stitching for large tiles
seed: 42
log_level: "INFO"

# ── Model paths ───────────────────────────────────────────────────────────────
models:
  sen2sr:
    model_dir: "model/SEN2SRLite"
    hf_mlm_url: "https://huggingface.co/tacofoundation/sen2sr/resolve/main/SEN2SRLite/main/mlm.json"
  able_model:
    weights_path: "model/Sen2SR_Able/final_weights.pth"
    feat_ch: 64
    num_blocks: 8
    sampling_steps: 100
    uncertainty_variations: 25
  opensr_model:
    ckpt_path: "opensr-ldsrs2_v1_0_0.ckpt"
    config_name: "config_10m.yaml"
    sampling_steps: 100        # FULL quality — 100 DDIM steps
    uncertainty_variations: 25 # FULL calibration — 25 stochastic passes

# ── Band definitions (unchanged — architecture constant) ─────────────────────
bands:
  all_10:
    - "B02" # Blue (10m)
    - "B03" # Green (10m)
    - "B04" # Red (10m)
    - "B05" # RedEdge 1 (20m)
    - "B06" # RedEdge 2 (20m)
    - "B07" # RedEdge 3 (20m)
    - "B08" # NIR 1 (10m)
    - "B8A" # NIR 2 (20m)
    - "B11" # SWIR 1 (20m)
    - "B12" # SWIR 2 (20m)
  scl: "SCL"
  rgbn_diffusion_order:
    - "B04"
    - "B03"
    - "B02"
    - "B08"

# ── Preprocessing ─────────────────────────────────────────────────────────────
preprocessing:
  reflectance_scale: 10000.0
  clip_min: 0.0
  clip_max: 1.0
  patch_multiple: 128
  cloud_shadow_classes:
    - 3   # Cloud shadows
    - 8   # Cloud medium probability
    - 9   # Cloud high probability
    - 10  # Thin cirrus

# ── Spectral hard constraint ──────────────────────────────────────────────────
hard_constraint:
  enabled: true
  filter_type: "ideal"
  cutoff: 64

# ── Areas of Interest ─────────────────────────────────────────────────────────
aois:
  urban_berlin:
    name: "Berlin, Germany (Urban AOI)"
    description: "High-density urban infrastructure, roads, and built-up areas"
    lat: 52.5200
    lon: 13.4050
    start_date: "2023-06-01"
    end_date: "2023-08-30"
    edge_size: 128
    collection: "sentinel-2-l2a"
  agri_valencia:
    name: "Valencia, Spain (Agricultural AOI)"
    description: "Heterogeneous crop fields, irrigation networks, and orchard parcels"
    lat: 39.4915
