# SRM Pipeline Configuration
# Hardware: RTX 3050 6GB VRAM — DO NOT exceed these values on this machine

# Global execution settings
device: "cuda"          # pipeline falls back to cpu on OOM
n_uncertainty: 5        # uncertainty passes for std estimation
sampling_steps: 100     # 100 DDIM steps for razor-sharp textures & high-frequency detail
use_tta: false          # set true for 4-fold dihedral ensembling (can also be passed via --tta)
eta: 0.95
patch_size: 128         # native 128px patch size
overlap: 32             # 25% overlap (stride 96) with 2D Hann window blending
seed: 42
log_level: "INFO"

# Model paths and checkpoints
models:
  sen2sr:
    model_dir: "model/SEN2SRLite"
    hf_mlm_url: "https://huggingface.co/tacofoundation/sen2sr/resolve/main/SEN2SRLite/main/mlm.json"
  able_model:
    weights_path: "model/Sen2SR_Able/final_weights.pth"
    feat_ch: 64
    num_blocks: 8
    sampling_steps: 50
    uncertainty_variations: 5
  opensr_model:
    ckpt_path: "opensr-ldsrs2_v1_0_0.ckpt"
    config_name: "config_10m.yaml"
    sampling_steps: 100      # DDIM sampling steps — 100 steps for full author quality
    uncertainty_variations: 5

# Band definitions
bands:
  all_10:
    - "B02" # Blue (10m)
    - "B03" # Green (10m)
    - "B04" # Red (10m)
    - "B05" # RedEdge 1 (20m)
    - "B06" # RedEdge 2 (20m)
    - "B07" # RedEdge 3 (20m)
    - "B08" # NIR 1 (10m)
    - "B8A" # NIR 2 (20m)
    - "B11" # SWIR 1 (20m)
    - "B12" # SWIR 2 (20m)
  scl: "SCL" # Scene Classification Layer
  rgbn_diffusion_order:
    - "B04" # Red -> channel 0
    - "B03" # Green -> channel 1
    - "B02" # Blue -> channel 2
    - "B08" # NIR -> channel 3

# Preprocessing settings
preprocessing:
  reflectance_scale: 10000.0
  clip_min: 0.0
  clip_max: 1.0
  patch_multiple: 128
  cloud_shadow_classes:
    - 3 # Cloud shadows
    - 8 # Cloud medium probability
    - 9 # Cloud high probability
    - 10 # Thin cirrus

# Filter settings for HardConstraint
hard_constraint:
  enabled: true
  filter_type: "ideal" # "ideal" or "gaussian"
  cutoff: 32 # Frequency cutoff radius (32 preserves sharp mid-to-high textures)

# Real named Areas of Interest (AOIs)
